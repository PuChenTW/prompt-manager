<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prompt Manager - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Prompt Manager</h1>
      <div class="header-actions">
        <button id="settings-btn" class="btn" title="Settings">
          <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button id="add-btn" class="btn btn-primary">+ Add Prompt</button>
      </div>
    </header>

    <div id="prompt-list" class="card">
      <!-- Prompts will be injected here -->
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content modal-sm">
        <h2 class="text-h2">Settings</h2>
        <div class="form-group">
          <label for="trigger-key-input" style="display: block; margin-bottom: 8px; font-weight: 500;">Trigger Key:</label>
          <div style="display: flex; align-items: center; gap: 12px;">
            <input type="text" id="trigger-key-input" class="form-control" style="flex: 1; text-align: center;" placeholder="Press any key..." readonly>
            <span style="color: var(--color-text-muted); font-size: 14px; white-space: nowrap;">(Click to record)</span>
          </div>
          <p style="margin-top: 12px; font-size: 13px; color: var(--color-text-secondary);">
            The shortcut used to open the prompt selection panel.
          </p>
          <p class="setting-hint">
            <strong>Note:</strong> Only combination keys (e.g., Ctrl + /, Alt + P) are supported.
          </p>
        </div>
        <div class="modal-actions">
          <button id="close-settings-btn" class="btn">Close</button>
          <button id="save-settings-btn" class="btn btn-primary">Save Settings</button>
        </div>
      </div>
    </div>

    <div id="editor" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <h2 id="editor-title">New Prompt</h2>
        <input type="text" id="title-input" class="form-control" placeholder="Title (e.g. Financial Analyst)">
        <textarea id="content-input" class="form-control" placeholder="Prompt text... Use {{variable}} for variables."></textarea>
        <div class="modal-actions">
          <button id="cancel-btn" class="btn">Cancel</button>
          <button id="save-btn" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
