<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prompt Manager - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Prompt Manager</h1>
      <button id="add-btn" class="btn btn-primary">+ Add Prompt</button>
    </header>

    <div id="settings-card" class="card" style="margin-bottom: 24px; padding: 24px;">
      <h2 class="text-h2">Settings</h2>
      <div style="display: flex; align-items: center; gap: 16px;">
        <label for="trigger-key-input" style="font-weight: 500;">Trigger Key:</label>
        <input type="text" id="trigger-key-input" class="form-control" style="width: 150px; text-align: center;" placeholder="Press any key..." readonly>
        <span style="color: var(--color-text-muted); font-size: 14px;">(Click to record)</span>
        <div style="flex: 1;"></div>
        <button id="save-settings-btn" class="btn btn-primary">Save Settings</button>
      </div>
    </div>

    <div id="prompt-list" class="card">
      <!-- Prompts will be injected here -->
    </div>

    <div id="editor" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <h2 id="editor-title">New Prompt</h2>
        <input type="text" id="title-input" class="form-control" placeholder="Title (e.g. Financial Analyst)">
        <textarea id="content-input" class="form-control" placeholder="Prompt text... Use {{variable}} for variables."></textarea>
        <div class="modal-actions">
          <button id="cancel-btn" class="btn">Cancel</button>
          <button id="save-btn" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
