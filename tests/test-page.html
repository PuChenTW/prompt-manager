<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt Manager Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea, input, [contenteditable] {
      display: block;
      margin: 10px 0;
      padding: 8px;
      width: 400px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea { height: 80px; }
    [contenteditable] { min-height: 80px; }
  </style>
</head>
<body>
  <h2>Test Page</h2>
  <label>Textarea:</label>
  <textarea id="test-textarea"></textarea>

  <label>Input:</label>
  <input type="text" id="test-input">

  <label>Contenteditable:</label>
  <div contenteditable="true" id="test-contenteditable"></div>
</body>
</html>
